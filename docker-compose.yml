services:
  workecho:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - workecho-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  workecho-data:
